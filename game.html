<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏详情 - 小游戏平台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">小游戏平台</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="category.html">游戏分类</a></li>
        <li><a href="#">排行榜</a></li>
        <li><a href="#">关于我们</a></li>
      </ul>
      <div class="search-container">
        <input type="text" class="search-box" placeholder="搜索游戏...">
        <button class="search-btn">搜索</button>
      </div>
    </div>
  </header>

  <!-- 主容器 -->
  <div class="container">
    <!-- 游戏详情 -->
    <div class="game-detail">
      <div class="game-header">
        <!-- 游戏详情将通过JavaScript动态渲染 -->
      </div>
    </div>

    <!-- 广告区域 -->
    <div class="ad-section">
      <div class="ad-title">广告</div>
      <div class="ad-content">
        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=game%20detail%20ad%20colorful%20cartoon%20style&image_size=landscape_16_9" alt="广告" class="ad-image">
      </div>
    </div>

    <!-- 游戏游玩区域 -->
    <div class="game-play-area">
      <h2 class="section-title">游戏游玩</h2>
      <div class="game-iframe">
        <!-- 游戏内容将通过JavaScript动态渲染 -->
        <h3>点击开始游戏按钮加载游戏</h3>
      </div>
    </div>

    <!-- 相关游戏 -->
    <div class="related-games">
      <h2 class="section-title">相关游戏</h2>
      <div class="game-grid">
        <!-- 相关游戏将通过JavaScript动态渲染 -->
      </div>
    </div>
  </div>

  <!-- 页脚 -->
  <footer>
    <div class="footer-container">
      <div class="footer-section">
        <h3>关于我们</h3>
        <ul>
          <li><a href="#">平台介绍</a></li>
          <li><a href="#">联系我们</a></li>
          <li><a href="#">加入我们</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h3>帮助中心</h3>
        <ul>
          <li><a href="#">常见问题</a></li>
          <li><a href="#">游戏指南</a></li>
          <li><a href="#">用户反馈</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h3>法律信息</h3>
        <ul>
          <li><a href="#">隐私政策</a></li>
          <li><a href="#">用户协议</a></li>
          <li><a href="#">版权声明</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <p>© 2026 小游戏平台. 保留所有权利.</p>
    </div>
  </footer>

  <!-- 引入数据和脚本 -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
