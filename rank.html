<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏排行榜 - 小游戏平台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">小游戏平台</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="category.html">游戏分类</a></li>
        <li><a href="rank.html">排行榜</a></li>
        <li><a href="#">关于我们</a></li>
      </ul>
      <div class="search-container">
        <input type="text" class="search-box" placeholder="搜索游戏...">
        <button class="search-btn">搜索</button>
      </div>
    </div>
  </header>

  <!-- 主容器 -->
  <div class="container">
    <!-- 广告区域 -->
    <div class="ad-section">
      <div class="ad-title">广告</div>
      <div class="ad-content">
        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=game%20ranking%20banner%20ad%20colorful%20cartoon%20style&image_size=landscape_16_9" alt="广告" class="ad-image">
      </div>
    </div>

    <!-- 排行榜分类导航 -->
    <div class="rank-nav">
      <h2>排行榜分类</h2>
      <div class="rank-links">
        <a href="rank.html?type=hot" class="rank-link" data-type="hot">综合热门游玩榜</a>
        <a href="rank.html?type=rise" class="rank-link" data-type="rise">今日飙升榜</a>
        <a href="rank.html?type=rating" class="rank-link" data-type="rating">好评评分榜</a>
        <a href="rank.html?type=favorite" class="rank-link" data-type="favorite">收藏人气榜</a>
        <a href="rank.html?type=action" class="rank-link" data-type="action">动作游戏榜</a>
        <a href="rank.html?type=adventure" class="rank-link" data-type="adventure">冒险游戏榜</a>
        <a href="rank.html?type=puzzle" class="rank-link" data-type="puzzle">益智游戏榜</a>
        <a href="rank.html?type=sports" class="rank-link" data-type="sports">体育游戏榜</a>
        <a href="rank.html?type=strategy" class="rank-link" data-type="strategy">策略游戏榜</a>
        <a href="rank.html?type=casual" class="rank-link" data-type="casual">休闲游戏榜</a>
      </div>
    </div>

    <!-- 排行榜内容 -->
    <div class="rank-content">
      <h2 class="section-title" id="rank-title">综合热门游玩榜</h2>
      <div class="rank-list" id="rank-list">
        <!-- 排行榜将通过JavaScript动态渲染 -->
      </div>
    </div>
  </div>

  <!-- 页脚 -->
  <footer>
    <div class="footer-container">
      <div class="footer-section">
        <h3>关于我们</h3>
        <ul>
          <li><a href="#">平台介绍</a></li>
          <li><a href="#">联系我们</a></li>
          <li><a href="#">加入我们</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h3>帮助中心</h3>
        <ul>
          <li><a href="#">常见问题</a></li>
          <li><a href="#">游戏指南</a></li>
          <li><a href="#">用户反馈</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h3>法律信息</h3>
        <ul>
          <li><a href="#">隐私政策</a></li>
          <li><a href="#">用户协议</a></li>
          <li><a href="#">版权声明</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <p>© 2026 小游戏平台. 保留所有权利.</p>
    </div>
  </footer>

  <!-- 引入数据和脚本 -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
